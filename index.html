<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vellura Towers | Architecture Stacker</title>
    <!-- Core Engines -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #011a14;
            font-family: 'Inter', sans-serif;
            color: white;
            user-select: none;
            touch-action: none;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        #score-container {
            margin-top: 50px;
            text-align: center;
            transition: opacity 0.3s;
        }

        #score {
            font-size: 100px;
            font-weight: 900;
            opacity: 0.15;
            line-height: 1;
            margin: 0;
        }

        #brand-label {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            font-size: 10px;
            letter-spacing: 0.8em;
            text-transform: uppercase;
            opacity: 0.4;
            font-weight: 900;
        }

        #instructions {
            position: absolute;
            bottom: 120px;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            font-size: 11px;
            font-weight: 900;
            color: #10b981;
            animation: breathe 2s infinite ease-in-out;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            padding: 40px 30px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            width: 85%;
            max-width: 340px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .status-msg { 
            font-size: 10px; 
            text-transform: uppercase; 
            letter-spacing: 0.4em; 
            margin-bottom: 15px; 
            color: #10b981; 
            font-weight: 900;
        }

        .final-score { 
            font-size: 80px; 
            font-weight: 900; 
            margin-bottom: 25px; 
            line-height: 0.8;
            letter-spacing: -0.05em;
        }
        
        button {
            background: #10b981;
            color: #011a14;
            border: none;
            padding: 22px;
            width: 100%;
            border-radius: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }

        button:active { transform: scale(0.94); }

        .global-tag {
            position: absolute;
            bottom: 30px;
            font-size: 8px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.2;
            font-weight: 900;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="brand-label">Vellura Design</div>

    <div id="ui">
        <div id="score-container">
            <div id="score">0</div>
            <div style="font-size: 10px; opacity: 0.5; letter-spacing: 0.2em;">LEVELS</div>
        </div>
        
        <div id="instructions">Tap to Place Floor</div>
        
        <div id="game-over">
            <div class="status-msg">Structure Unstable</div>
            <div class="final-score" id="final-score">0</div>
            <button onclick="location.reload()">Build New Tower</button>
            <div style="margin-top: 25px; font-size: 8px; opacity: 0.4; text-transform: uppercase; line-height: 1.8;">
                Vellura Design | Inspired by Luxury Living<br>
                Part of the Penthouse 28 Project
            </div>
        </div>

        <div class="global-tag">Vellura Design | Built for the World</div>
    </div>

    <script>
        let world, scene, camera, renderer;
        let blocks = [];
        let score = 0;
        let gameActive = true;
        let gameSpeed = 0.14;
        const boxHeight = 1;

        function init() {
            // Physics
            world = new CANNON.World();
            world.gravity.set(0, -20, 0);
            world.solver.iterations = 10;

            // Visuals
            scene = new THREE.Scene();

            const aspect = window.innerWidth / window.innerHeight;
            const d = 8;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 1000);
            camera.position.set(10, 10, 10);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sun = new THREE.DirectionalLight(0xffffff, 0.7);
            sun.position.set(5, 15, 2);
            scene.add(sun);

            createBlock(0, 0, 4, 4, false); // Foundation
            createBlock(0, 0, 4, 4, true);  // First moving block

            window.addEventListener('mousedown', trigger);
            window.addEventListener('touchstart', trigger);
            window.addEventListener('resize', onResize);

            animate();
        }

        function trigger(e) {
            if (!gameActive || (e.type === 'mousedown' && e.button !== 0)) return;
            
            const top = blocks[blocks.length - 1];
            const prev = blocks[blocks.length - 2];
            const axis = top.direction;
            const delta = top.mesh.position[axis] - prev.mesh.position[axis];
            const size = (axis === 'x' ? top.width : top.depth);
            const overlap = size - Math.abs(delta);

            if (overlap > 0) {
                const newW = axis === 'x' ? overlap : top.width;
                const newD = axis === 'z' ? overlap : top.depth;
                const pos = prev.mesh.position[axis] + delta / 2;

                top.width = newW; top.depth = newD;
                top.mesh.scale[axis] = overlap / size;
                top.mesh.position[axis] = pos;
                top.isMoving = false;

                score++;
                document.getElementById('score').innerText = score;
                gameSpeed += 0.005;
                camera.position.y += boxHeight;

                // Success flash
                if (Math.abs(delta) < 0.1) {
                    document.body.style.backgroundColor = '#10b981';
                    setTimeout(() => document.body.style.backgroundColor = '#011a14', 50);
                }

                createBlock(top.mesh.position.x, top.mesh.position.z, newW, newD, true);
            } else {
                fail();
            }
        }

        function createBlock(x, z, w, d, moving) {
            const y = (blocks.length - 1) * boxHeight;
            const geo = new THREE.BoxGeometry(w, boxHeight, d);
            const mat = new THREE.MeshPhongMaterial({ color: score % 2 === 0 ? 0xffffff : 0x10b981, flatShading: true });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y + boxHeight, z);
            if (moving) mesh.position[score % 2 === 0 ? 'x' : 'z'] = -10;
            scene.add(mesh);
            blocks.push({ mesh, width: w, depth: d, isMoving: moving, direction: score % 2 === 0 ? 'x' : 'z' });
        }

        function fail() {
            gameActive = false;
            const top = blocks[blocks.length - 1];
            const shape = new CANNON.Box(new CANNON.Vec3(top.width/2, boxHeight/2, top.depth/2));
            const body = new CANNON.Body({ mass: 5 });
            body.addShape(shape);
            body.position.copy(top.mesh.position);
            body.angularVelocity.set(Math.random()*2, Math.random()*2, Math.random()*2);
            world.addBody(body);
            top.body = body;

            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = score;
        }

        function onResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const d = 8;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            if (!gameActive && (!blocks.length || !blocks[blocks.length-1].body)) return;
            requestAnimationFrame(animate);

            if (gameActive) {
                const top = blocks[blocks.length - 1];
                if (top && top.isMoving) {
                    top.mesh.position[top.direction] += gameSpeed;
                    if (top.mesh.position[top.direction] > 10) top.mesh.position[top.direction] = -10;
                }
            } else {
                world.step(1/60);
                const last = blocks[blocks.length - 1];
                if (last && last.body) {
                    last.mesh.position.copy(last.body.position);
                    last.mesh.quaternion.copy(last.body.quaternion);
                }
            }
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
