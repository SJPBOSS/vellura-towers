    <style>
        @font-face {
            font-family: "Libre Baskerville";
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url("fonts/libre-baskerville-latin-400-normal.woff2") format("woff2");
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        @font-face {
            font-family: "Libre Baskerville";
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url("fonts/libre-baskerville-latin-700-normal.woff2") format("woff2");
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        @font-face {
            font-family: "Source Sans 3";
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url("fonts/source-sans-3-latin-400-normal.woff2") format("woff2");
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        @font-face {
            font-family: "Source Sans 3";
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: url("fonts/source-sans-3-latin-600-normal.woff2") format("woff2");
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        :root {
            --ink: #f3e6c8;
            --gold: #e6c36a;
            --muted: #cbb98a;
            --glass: rgba(12, 14, 18, 0.94);
            --line: rgba(214, 176, 96, 0.78);
            --night: #07090e;
            --serif: "Libre Baskerville", Palatino, "Palatino Linotype", Georgia, serif;
            --sans: "Source Sans 3", "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--night);
            color: var(--ink);
            font-family: var(--sans);
            overflow: hidden;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        #topbar {
            position: absolute;
            z-index: 4;
            top: calc(10px + env(safe-area-inset-top));
            left: calc(10px + env(safe-area-inset-left));
            right: calc(10px + env(safe-area-inset-right));
            display: grid;
            grid-template-columns: 92px 1fr 92px;
            align-items: center;
            gap: 4px;
        }

        #topbar.locked { pointer-events: none; }

        #wordmark {
            margin: 0;
            text-align: center;
            font-family: var(--serif);
            font-size: clamp(11px, 2.5vw, 13px);
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--gold);
            white-space: nowrap;
        }

        #controls {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
        }

        #hud {
            position: absolute;
            z-index: 2;
            top: calc(58px + env(safe-area-inset-top));
            left: 0;
            right: 0;
            text-align: center;
            pointer-events: none;
        }

        #score {
            display: inline-block;
            font-family: var(--serif);
            font-size: clamp(44px, 11vw, 68px);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.03em;
            line-height: 0.9;
            color: var(--gold);
            transform-origin: center;
        }

        #score.tick { animation: score-tick 200ms ease; }

        #score-label, #best {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        #score-label { margin-top: 4px; }

        #best { margin-top: 2px; min-height: 1em; }

        #callout {
            position: absolute;
            z-index: 3;
            top: calc(178px + env(safe-area-inset-top));
            left: 16px;
            right: 16px;
            margin: 0;
            text-align: center;
            font-family: var(--serif);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--gold);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
            pointer-events: none;
            opacity: 0;
            transition: opacity 160ms ease;
        }

        #callout.show { opacity: 1; }

        #hint, #status {
            position: absolute;
            z-index: 2;
            left: calc(16px + env(safe-area-inset-left));
            right: calc(16px + env(safe-area-inset-right));
            text-align: center;
        }

        #hint {
            bottom: calc(22px + env(safe-area-inset-bottom));
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--ink);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
            pointer-events: none;
        }

        #hint[hidden] { display: none; }

        #status {
            z-index: 6;
            inset: 0;
            display: grid;
            place-items: center;
            margin: 0;
            padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
            background: var(--night);
            font-size: 16px;
            line-height: 1.45;
        }

        #status[hidden] { display: none !important; }

        #result {
            position: absolute;
            z-index: 5;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(340px, calc(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right)));
            padding: 28px 22px 20px;
            background: var(--glass);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            text-align: center;
            touch-action: manipulation;
        }

        #result[hidden] { display: none !important; }

        #result.show { animation: rise 280ms cubic-bezier(.2, .7, .2, 1); }

        #result-title {
            margin: 0;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        #final-score {
            margin: 8px 0 0;
            font-family: var(--serif);
            font-size: clamp(52px, 16vw, 72px);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.03em;
            line-height: 0.9;
            color: var(--gold);
        }

        #final-note {
            margin: 12px 0 0;
            font-family: var(--serif);
            font-size: 16px;
            line-height: 1.35;
            color: var(--ink);
        }

        #final-meta, #final-best {
            margin: 8px 0 0;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        #final-meta { color: var(--gold); }

        #final-best { margin-bottom: 18px; }

        button { font: inherit; color: inherit; background: none; border: 0; padding: 0; touch-action: manipulation; }

        #again {
            width: 100%;
            border-radius: 8px;
            padding: 14px 16px;
            background: var(--gold);
            color: #1a140c;
            font-weight: 600;
            font-size: 15px;
            line-height: 1;
            letter-spacing: 0.02em;
            cursor: pointer;
        }

        #again:hover { background: #f0d48a; }

        #again:active { background: #d7b25a; }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            border: 1px solid rgba(214, 176, 96, 0.55);
            background: rgba(7, 9, 14, 0.45);
            color: var(--gold);
            cursor: pointer;
        }

        .icon-btn:hover { background: rgba(230, 195, 106, 0.14); }

        .icon-btn:active { background: rgba(230, 195, 106, 0.24); }

        .icon-btn svg { display: block; }

        button:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 3px;
        }

        #result:focus { outline: none; }

        #result:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 4px;
        }

        @keyframes score-tick {
            0% { transform: scale(1); }
            40% { transform: scale(1.045); }
            100% { transform: scale(1); }
        }

        @keyframes rise {
            from { opacity: 0; transform: translate(-50%, -46%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        @media (max-width: 380px) {
            #topbar { grid-template-columns: 84px 1fr 84px; }
            #wordmark { letter-spacing: 0.08em; font-size: 11px; }
        }

        @media (max-height: 520px) {
            #topbar { top: calc(6px + env(safe-area-inset-top)); }
            .icon-btn { width: 34px; height: 34px; }
            #hud { top: calc(44px + env(safe-area-inset-top)); }
            #score { font-size: 32px; }
            #callout { top: calc(120px + env(safe-area-inset-top)); font-size: 12px; }
            #hint { bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 13px; }
        }

        @media (prefers-reduced-motion: reduce) {
            #result.show, #score.tick { animation: none; }
            #callout, #hint, #status, button { transition: none; }
        }
    </style>
</head>
<body>
    <p class="sr">Vellura Towers. Stack each floor as it slides across the tower. Tap or press Space to place it. A centered floor stays whole.</p>
    <header id="topbar">
        <div aria-hidden="true"></div>
        <h1 id="wordmark">Vellura Towers</h1>
        <div id="controls">
            <button type="button" id="mute" class="icon-btn" aria-pressed="false" aria-label="Mute sound">
                <span class="sound-on">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M4 10h3.2L11 6.5v11L7.2 14H4z"/>
                        <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M15.5 9.2a3.6 3.6 0 010 5.6"/>
                        <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M17.8 7a6.4 6.4 0 010 10"/>
                    </svg>
                </span>
                <span class="sound-off" hidden>
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M4 10h3.2L11 6.5v11L7.2 14H4z"/>
                        <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M16 10l4 4M20 10l-4 4"/>
                    </svg>
                </span>
            </button>
            <button type="button" id="full" class="icon-btn" aria-pressed="false" aria-label="Enter fullscreen">
                <span class="fs-enter">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/>
                    </svg>
                </span>
                <span class="fs-exit" hidden>
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
                    </svg>
                </span>
            </button>
        </div>
    </header>
    <div id="hud">
        <div id="score" aria-hidden="true">0</div>
        <div id="score-label">Floors</div>
        <div id="best"></div>
    </div>
    <p id="score-live" class="sr" aria-live="polite">0 floors</p>
    <p id="callout" aria-live="polite"></p>
    <p id="hint" aria-live="polite">Watch the floor slide in</p>
    <p id="status" role="status">Loading Vellura Towers…</p>
    <div id="result" role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="result-title" aria-describedby="final-score final-note" hidden>
        <p id="result-title">The floor missed</p>
        <p id="final-score">0</p>
        <p id="final-note"></p>
        <p id="final-meta" hidden></p>
        <p id="final-best" hidden></p>
        <button type="button" id="again">Build again</button>
    </div>
    <noscript>Vellura Towers needs JavaScript to build the tower.</noscript>
    <script src="vendor/three.min.js"></script>
    <script src="vendor/cannon.min.js"></script>
    <script>
        (function () {
            const SPEED_START = 8.2;
            const SPEED_STEP = 0.26;
            const SPEED_CAP = 13.5;
            const PERFECT_FRACTION = 0.12;
            const PERFECT_MIN = 0.24;
            const MIN_OVERLAP = 0.18;
            const OPENING_MS = 1000;
            const APPROACH_LOCK_MS = 200;
            const RESULT_DELAY_MS = 700;
            const SETBACK_EVERY = 5;
            const SETBACK_SCALE = 0.88;
            const BEST_KEY = 'vellura-towers-best';
            const MUTE_KEY = 'vellura-towers-mute';
            const INTRO_KEY = 'vellura-towers-intro';

            const scoreEl = document.getElementById('score');
            const scoreLiveEl = document.getElementById('score-live');
            const bestEl = document.getElementById('best');
            const hintEl = document.getElementById('hint');
            const calloutEl = document.getElementById('callout');
            const statusEl = document.getElementById('status');
            const resultEl = document.getElementById('result');
            const finalScoreEl = document.getElementById('final-score');
            const finalNoteEl = document.getElementById('final-note');
            const finalMetaEl = document.getElementById('final-meta');
            const finalBestEl = document.getElementById('final-best');
            const againEl = document.getElementById('again');
            const muteEl = document.getElementById('mute');
            const fullEl = document.getElementById('full');
            const topbarEl = document.getElementById('topbar');

            const state = {
                score: 0,
                best: 0,
                perfects: 0,
                streak: 0,
                active: false,
                speed: SPEED_START,
                inputOpenAt: 0,
                windupUntil: 0,
                top: null,
                moving: null,
                blocks: [],
                rubble: [],
                dynamics: [],
                plinth: null,
                resultShown: false,
                resultTimer: 0,
                hintTimer: 0,
                calloutTimer: 0,
                acc: 0,
                reduced: false,
                muted: false,
                introSeen: false,
                missReason: '',
                kick: 0,
                placeHint: 'Tap when it lines up'
            };

            const settles = [];
            let world, scene, camera, renderer;
            let grain, jointMat, groundMesh, contactShadow, aimShadow, ember;
            let look, lookTo, camTo, sampleA, emissiveOff, emissiveLock;
            let rafId = 0;
            let lastT = 0;
            let audioCtx = null;
            let noiseBuffer = null;

            function loadBest() {
                try {
                    const n = Number(localStorage.getItem(BEST_KEY));
                    return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
                } catch (err) {
                    return 0;
                }
            }

            function saveBest(value) {
                try { localStorage.setItem(BEST_KEY, String(value)); } catch (err) {}
            }

            function loadFlag(key) {
                try { return localStorage.getItem(key) === '1'; } catch (err) { return false; }
            }

            function saveFlag(key, on) {
                try { localStorage.setItem(key, on ? '1' : '0'); } catch (err) {}
            }

            function showStatus(message) {
                statusEl.hidden = false;
                statusEl.textContent = message;
            }

            function readMotion() {
                state.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            }

            function stoneColor(level, moving) {
                const t = Math.min(1, level / 16);
                const color = new THREE.Color('#3c404a');
                color.lerp(new THREE.Color('#8d6b4a'), t);
                if (moving) color.offsetHSL(0.015, 0.06, 0.07);
                return color;
            }

            function makeGrain() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const g = canvas.getContext('2d');
                g.fillStyle = '#f3f1ec';
                g.fillRect(0, 0, 128, 128);
                for (let i = 0; i < 900; i++) {
                    const v = 20 + Math.random() * 40;
                    g.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 6) + ',' + (0.04 + Math.random() * 0.08) + ')';
                    g.fillRect(Math.random() * 128, Math.random() * 128, 1 + Math.random() * 1.4, 1);
                }
                for (let i = 0; i < 80; i++) {
                    g.fillStyle = 'rgba(196, 150, 72,' + (0.04 + Math.random() * 0.06) + ')';
                    g.fillRect(Math.random() * 128, Math.random() * 128, 1, 1);
                }
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                return tex;
            }

            function makeSky() {
                const canvas = document.createElement('canvas');
                canvas.width = 4;
                canvas.height = 512;
                const g = canvas.getContext('2d');
                const fade = g.createLinearGradient(0, 0, 0, 512);
                fade.addColorStop(0, '#05070d');
                fade.addColorStop(0.46, '#101624');
                fade.addColorStop(0.7, '#1c1714');
                fade.addColorStop(1, '#0c0e13');
                g.fillStyle = fade;
                g.fillRect(0, 0, 4, 512);
                const tex = new THREE.CanvasTexture(canvas);
                tex.magFilter = THREE.LinearFilter;
                tex.minFilter = THREE.LinearFilter;
                return tex;
            }

            function makeShadowTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const g = canvas.getContext('2d');
                const fade = g.createRadialGradient(64, 64, 6, 64, 64, 64);
                fade.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
                fade.addColorStop(0.45, 'rgba(0, 0, 0, 0.22)');
                fade.addColorStop(1, 'rgba(0, 0, 0, 0)');
                g.fillStyle = fade;
                g.fillRect(0, 0, 128, 128);
                return new THREE.CanvasTexture(canvas);
            }

            function makeGlowTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const g = canvas.getContext('2d');
                const fade = g.createRadialGradient(64, 64, 2, 64, 64, 64);
                fade.addColorStop(0, 'rgba(232, 176, 86, 0.55)');
                fade.addColorStop(0.28, 'rgba(176, 92, 36, 0.22)');
                fade.addColorStop(1, 'rgba(176, 92, 36, 0)');
                g.fillStyle = fade;
                g.fillRect(0, 0, 128, 128);
                return new THREE.CanvasTexture(canvas);
            }

            function makeAimTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const g = canvas.getContext('2d');
                const fade = g.createRadialGradient(64, 64, 18, 64, 64, 60);
                fade.addColorStop(0, 'rgba(214, 168, 80, 0)');
                fade.addColorStop(0.55, 'rgba(214, 168, 80, 0.15)');
                fade.addColorStop(0.78, 'rgba(230, 190, 110, 0.7)');
                fade.addColorStop(1, 'rgba(214, 168, 80, 0)');
                g.fillStyle = fade;
                g.fillRect(0, 0, 128, 128);
                return new THREE.CanvasTexture(canvas);
            }

            function makeBlock(w, d, level, moving) {
                const stepped = level > 0 && level % SETBACK_EVERY === 0;
                const jointH = stepped ? 0.15 : 0.07;
                const slabH = 1 - jointH;
                const group = new THREE.Group();
                const slabMat = new THREE.MeshPhongMaterial({
                    map: grain,
                    color: stoneColor(level, moving),
                    specular: '#d4b072',
                    shininess: 68
                });
                const slabGeo = new THREE.BoxGeometry(w, slabH, d);
                const slab = new THREE.Mesh(slabGeo, slabMat);
                slab.position.y = jointH / 2;
                const jointGeo = new THREE.BoxGeometry(w * 0.985, jointH, d * 0.985);
                const joint = new THREE.Mesh(jointGeo, jointMat);
                joint.position.y = -0.5 + jointH / 2;
                group.add(slab);
                group.add(joint);
                scene.add(group);
                return {
                    group: group,
                    width: w,
                    depth: d,
                    height: 1,
                    level: level,
                    geos: [slabGeo, jointGeo],
                    mats: [slabMat]
                };
            }

            function settleColor(block) {
                const mat = block.group.children[0].material;
                mat.color.copy(stoneColor(block.level, false));
                mat.emissive.copy(emissiveOff);
            }

            function disposeBlock(block) {
                if (!block) return;
                scene.remove(block.group);
                block.geos.forEach((geo) => geo.dispose());
                block.mats.forEach((mat) => mat.dispose());
            }

            function resetWorld() {
                world = new CANNON.World();
                world.gravity.set(0, -18, 0);
                world.solver.iterations = 8;
                world.allowSleep = true;
                const groundBody = new CANNON.Body({ mass: 0 });
                groundBody.addShape(new CANNON.Plane());
                groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
                world.addBody(groundBody);
            }

            function addStatic(block) {
                const body = new CANNON.Body({ mass: 0 });
                body.addShape(new CANNON.Box(new CANNON.Vec3(block.width / 2, block.height / 2, block.depth / 2)));
                body.position.set(block.group.position.x, block.group.position.y, block.group.position.z);
                world.addBody(body);
                block.body = body;
            }

            function releaseDynamic(block) {
                const body = new CANNON.Body({ mass: 3.2, linearDamping: 0.1, angularDamping: 0.32 });
                body.addShape(new CANNON.Box(new CANNON.Vec3(block.width / 2, block.height / 2, block.depth / 2)));
                body.position.set(block.group.position.x, block.group.position.y, block.group.position.z);
                body.quaternion.set(block.group.quaternion.x, block.group.quaternion.y, block.group.quaternion.z, block.group.quaternion.w);
                const awayX = block.group.position.x;
                const awayZ = block.group.position.z;
                const away = Math.hypot(awayX, awayZ) || 1;
                body.velocity.set((awayX / away) * 1.6, 0.15, (awayZ / away) * 1.6);
                body.angularVelocity.set((Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 1.5);
                body.allowSleep = true;
                body.sleepSpeedLimit = 0.28;
                body.sleepTimeLimit = 0.45;
                world.addBody(body);
                state.dynamics.push({ body: body, block: block, born: performance.now() });
                state.rubble.push(block);
            }

            function layoutCamera() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const shortSide = Math.min(w, h);
                const slabPx = THREE.Math.clamp(shortSide * 0.36, 108, 260);
                const pixelsPerUnit = slabPx / 4;
                const d = (h / pixelsPerUnit) / 2;
                const aspect = w / Math.max(h, 1);
                camera.top = d;
                camera.bottom = -d;
                camera.left = -d * aspect;
                camera.right = d * aspect;
                camera.updateProjectionMatrix();
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.setSize(w, h);
            }

            function focusPoint(target) {
                const top = state.top;
                if (!top) {
                    target.set(0, 1.4, 0);
                    return target;
                }
                target.set(top.group.position.x, top.group.position.y + 0.85, top.group.position.z);
                return target;
            }

            function snapCamera() {
                focusPoint(look);
                camera.position.set(look.x + 11, look.y + 10.5, look.z + 11);
                camera.lookAt(look);
                lookTo.copy(look);
            }

            function updateContact() {
                const blocks = state.blocks;
                if (!blocks.length) return;
                let x = 0;
                let z = 0;
                let reach = 2;
                for (let i = 0; i < blocks.length; i++) {
                    x += blocks[i].group.position.x;
                    z += blocks[i].group.position.z;
                    reach = Math.max(reach, blocks[i].width, blocks[i].depth);
                }
                x /= blocks.length;
                z /= blocks.length;
                contactShadow.position.x = x;
                contactShadow.position.z = z;
                const span = reach * 2.15;
                contactShadow.scale.set(span, span, 1);
                ember.position.x = x;
                ember.position.z = z;
            }

            function updateCamera(dt) {
                focusPoint(lookTo);
                camTo.set(lookTo.x + 11, lookTo.y + 10.5, lookTo.z + 11);
                if (state.reduced) {
                    look.copy(lookTo);
                    camera.position.copy(camTo);
                } else {
                    const k = 1 - Math.exp(-Math.max(dt, 0.016) * 4.5);
                    look.lerp(lookTo, k);
                    camera.position.lerp(camTo, k);
                }
                camera.lookAt(look);
                updateContact();
            }

            function withinFrame(block, axis, offset) {
                const top = state.top.group.position;
                const x = axis === 'x' ? top.x + offset : block.group.position.x;
                const z = axis === 'z' ? top.z + offset : block.group.position.z;
                const y = block.group.position.y;
                const hw = block.width / 2;
                const hd = block.depth / 2;
                camera.updateMatrixWorld(true);
                for (let ix = 0; ix < 2; ix++) {
                    for (let iy = 0; iy < 2; iy++) {
                        for (let iz = 0; iz < 2; iz++) {
                            sampleA.set(x + (ix ? hw : -hw), y + (iy ? 0.5 : -0.5), z + (iz ? hd : -hd));
                            sampleA.project(camera);
                            if (Math.abs(sampleA.x) > 0.92 || Math.abs(sampleA.y) > 0.92) return false;
                        }
                    }
                }
                return true;
            }

            function travelLimit(block) {
                const axis = block.axis;
                const span = axis === 'x' ? block.width : block.depth;
                const clear = span + 1.15;
                const missAt = Math.max(span * 0.55 + 0.4, span - MIN_OVERLAP + 0.08);
                let lo = 0;
                let hi = clear;
                for (let i = 0; i < 7; i++) {
                    const mid = (lo + hi) / 2;
                    if (withinFrame(block, axis, mid) && withinFrame(block, axis, -mid)) lo = mid;
                    else hi = mid;
                }
                if (lo >= missAt) return Math.min(clear, lo);
                return Math.min(clear, missAt);
            }

            function overlapInfo(moving) {
                const axis = moving.axis;
                const prev = state.top;
                const pw = axis === 'x' ? prev.width : prev.depth;
                const mw = axis === 'x' ? moving.width : moving.depth;
                const pc = prev.group.position[axis];
                const mc = moving.group.position[axis];
                const left = Math.max(pc - pw / 2, mc - mw / 2);
                const right = Math.min(pc + pw / 2, mc + mw / 2);
                return {
                    axis: axis,
                    pw: pw,
                    mw: mw,
                    pc: pc,
                    mc: mc,
                    left: left,
                    right: right,
                    overlap: right - left,
                    delta: mc - pc
                };
            }

            function spawnMover() {
                let w = state.top.width;
                let d = state.top.depth;
                const level = state.score;
                const setback = level > 0 && level % SETBACK_EVERY === 0;
                if (setback) {
                    w *= SETBACK_SCALE;
                    d *= SETBACK_SCALE;
                }
                const block = makeBlock(w, d, level, true);
                const axis = level % 2 === 0 ? 'x' : 'z';
                const dir = level % 2 === 0 ? 1 : -1;
                block.axis = axis;
                block.group.position.set(state.top.group.position.x, state.top.group.position.y + 1, state.top.group.position.z);
                const span = axis === 'x' ? w : d;
                const limit = travelLimit(block);
                block.group.position[axis] = state.top.group.position[axis] - dir * limit;
                block.dir = dir;
                block.armed = false;
                block.seen = false;
                block.readyAt = performance.now() + APPROACH_LOCK_MS;
                state.moving = block;
                if (level === 0) {
                    const outside = Math.max(0.2, limit - span);
                    const approachMs = (outside / state.speed) * 1000;
                    state.windupUntil = state.inputOpenAt - approachMs;
                }
                return setback;
            }

            function positionAimShadow(moving, lock) {
                const topY = state.top.group.position.y + state.top.height / 2;
                const fit = lock ? 0.92 : 1;
                aimShadow.position.set(moving.group.position.x, topY + 0.035, moving.group.position.z);
                aimShadow.scale.set(moving.width * fit, moving.depth * fit, 1);
                aimShadow.visible = true;
            }

            function openingHint() {
                const ready = performance.now() >= state.inputOpenAt;
                if (!state.introSeen) return ready ? state.placeHint : 'Watch the floor slide in';
                return ready ? 'Tap to place the floor' : 'Watch the floor';
            }

            function updateMover(dt) {
                const moving = state.moving;
                if (!moving || !state.top) {
                    aimShadow.visible = false;
                    return;
                }
                const axis = moving.axis;
                const center = state.top.group.position[axis];
                const span = axis === 'x' ? moving.width : moving.depth;
                const limit = travelLimit(moving);
                const hold = state.score === 0 && performance.now() < state.windupUntil;
                if (hold) {
                    moving.group.position[axis] = center - moving.dir * limit;
                } else {
                    let pos = moving.group.position[axis] + moving.dir * state.speed * dt;
                    const max = center + limit;
                    const min = center - limit;
                    if (pos >= max) {
                        pos = max;
                        moving.dir = -1;
                    } else if (pos <= min) {
                        pos = min;
                        moving.dir = 1;
                    }
                    moving.group.position[axis] = pos;
                }
                const info = overlapInfo(moving);
                const gate = state.score === 0 ? state.inputOpenAt : moving.readyAt;
                if (info.overlap > MIN_OVERLAP) moving.seen = true;
                const tooThin = info.mw <= MIN_OVERLAP;
                if (performance.now() >= gate && (moving.seen || tooThin)) moving.armed = true;
                const perfectLimit = Math.max(PERFECT_MIN, info.mw * PERFECT_FRACTION);
                const lock = Math.abs(info.delta) <= perfectLimit && info.overlap > MIN_OVERLAP;
                const closeness = 1 - Math.min(1, Math.abs(info.delta) / Math.max(span, 0.001));
                aimShadow.material.opacity = lock ? 0.92 : 0.16 + closeness * 0.34;
                moving.group.children[0].material.emissive.copy(lock ? emissiveLock : emissiveOff);
                positionAimShadow(moving, lock);
                if (state.score === 0 && state.active) {
                    const next = openingHint();
                    if (hintEl.textContent !== next) hintEl.textContent = next;
                }
            }

            function updateSettles() {
                const now = performance.now();
                for (let i = settles.length - 1; i >= 0; i--) {
                    const item = settles[i];
                    const t = Math.min(1, (now - item.start) / 180);
                    const k = 1 - Math.pow(1 - t, 3);
                    item.block.group.scale.y = 0.97 + 0.03 * k;
                    if (item.flash) {
                        const left = 1 - t;
                        item.block.group.children[0].material.emissive.setRGB((0x6a / 255) * left, (0x4a / 255) * left, (0x16 / 255) * left);
                    }
                    if (t >= 1) settles.splice(i, 1);
                }
            }

            function updateDynamics(dt) {
                if (!state.dynamics.length) return;
                state.acc += dt;
                let steps = 0;
                while (state.acc >= 1 / 60 && steps < 3) {
                    world.step(1 / 60);
                    state.acc -= 1 / 60;
                    steps += 1;
                }
                if (steps === 3) state.acc = 0;
                for (let i = state.dynamics.length - 1; i >= 0; i--) {
                    const item = state.dynamics[i];
                    const p = item.body.position;
                    const q = item.body.quaternion;
                    item.block.group.position.set(p.x, p.y, p.z);
                    item.block.group.quaternion.set(q.x, q.y, q.z, q.w);
                    const v = item.body.velocity;
                    const speed2 = v.x * v.x + v.y * v.y + v.z * v.z;
                    if (speed2 < 0.25) item.still = (item.still || 0) + dt;
                    else item.still = 0;
                    const asleep = item.body.sleepState === CANNON.Body.SLEEPING || item.still > 0.7;
                    const lost = p.y < -4 || performance.now() - item.born > 6000;
                    if (asleep || lost) {
                        world.removeBody(item.body);
                        state.dynamics.splice(i, 1);
                        if (lost) disposeBlock(item.block);
                    }
                }
            }

            function audio() {
                if (state.muted) return null;
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return audioCtx;
            }

            function noiseBurst(freq, dur, gainValue) {
                const ctx = audio();
                if (!ctx) return;
                if (!noiseBuffer) {
                    const count = Math.max(1, Math.floor(ctx.sampleRate * 0.2));
                    noiseBuffer = ctx.createBuffer(1, count, ctx.sampleRate);
                    const data = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
                }
                const src = ctx.createBufferSource();
                src.buffer = noiseBuffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = freq;
                const gain = ctx.createGain();
                const now = ctx.currentTime;
                gain.gain.setValueAtTime(gainValue, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
                src.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                src.start(now);
                src.stop(now + dur + 0.02);
            }

            function tone(freq, dur, gainValue) {
                const ctx = audio();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                const now = ctx.currentTime;
                gain.gain.setValueAtTime(gainValue, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + dur);
            }

            function playPlace(perfect) {
                if (state.muted) return;
                try {
                    if (perfect) {
                        noiseBurst(1400, 0.06, 0.06);
                        tone(392, 0.14, 0.03);
                        tone(587, 0.18, 0.018);
                    } else {
                        noiseBurst(700, 0.045, 0.08);
                        tone(196, 0.07, 0.035);
                    }
                } catch (err) {}
            }

            function playMiss() {
                if (state.muted) return;
                try {
                    noiseBurst(220, 0.16, 0.14);
                    tone(92, 0.2, 0.045);
                } catch (err) {}
            }

            function buzz(ms) {
                if (state.reduced || !navigator.vibrate) return;
                try { navigator.vibrate(ms); } catch (err) {}
            }

            function paintScore(tick) {
                scoreEl.textContent = String(state.score);
                scoreLiveEl.textContent = state.score === 1 ? '1 floor' : state.score + ' floors';
                if (!tick || state.reduced) return;
                scoreEl.classList.remove('tick');
                void scoreEl.offsetWidth;
                scoreEl.classList.add('tick');
            }

            function showHint(text, ms) {
                hintEl.hidden = false;
                hintEl.textContent = text;
                clearTimeout(state.hintTimer);
                if (ms) state.hintTimer = setTimeout(() => { hintEl.hidden = true; }, ms);
            }

            function showCallout(text) {
                calloutEl.textContent = text;
                calloutEl.classList.add('show');
                clearTimeout(state.calloutTimer);
                state.calloutTimer = setTimeout(() => {
                    calloutEl.classList.remove('show');
                    calloutEl.textContent = '';
                }, state.reduced ? 400 : 760);
            }

            function addKick(px) {
                if (state.reduced) return;
                state.kick += px;
            }

            function applyKick(dt) {
                const canvas = renderer.domElement;
                if (!state.kick) {
                    if (canvas.style.transform) canvas.style.transform = '';
                    return;
                }
                canvas.style.transform = 'translate3d(0,' + state.kick.toFixed(2) + 'px,0)';
                state.kick *= Math.exp(-Math.max(dt, 0.016) * 12);
                if (Math.abs(state.kick) < 0.15) {
                    state.kick = 0;
                    canvas.style.transform = '';
                }
            }

            function punchBlock(block, flash) {
                if (!block || state.reduced) return;
                block.group.scale.y = 0.97;
                if (flash) block.group.children[0].material.emissive.setHex(0x6a4a16);
                settles.push({ block: block, start: performance.now(), flash: !!flash });
            }

            function markIntro() {
                if (state.introSeen) return;
                state.introSeen = true;
                saveFlag(INTRO_KEY, true);
            }

            function succeed(perfect) {
                const first = state.score === 0 && !state.introSeen;
                state.score += 1;
                paintScore(true);
                const setback = spawnMover();
                if (perfect) {
                    state.perfects += 1;
                    state.streak += 1;
                    showCallout(state.streak >= 2 ? 'Perfect · ' + state.streak : 'Perfect');
                } else {
                    state.streak = 0;
                    if (setback) showCallout('Setback');
                    else {
                        clearTimeout(state.calloutTimer);
                        calloutEl.classList.remove('show');
                        calloutEl.textContent = '';
                    }
                }
                if (first) {
                    showHint('A centered floor keeps its full size', 2600);
                    markIntro();
                } else {
                    hintEl.hidden = true;
                }
                state.speed = Math.min(SPEED_CAP, SPEED_START + state.score * SPEED_STEP);
                playPlace(perfect);
                buzz(perfect ? 14 : 8);
                addKick(perfect ? -3.2 : -2);
            }

            function miss(block, reason) {
                state.active = false;
                state.moving = null;
                state.missReason = reason;
                state.streak = 0;
                hintEl.hidden = true;
                aimShadow.visible = false;
                releaseDynamic(block);
                playMiss();
                buzz(28);
                addKick(6);
                scheduleResult();
            }

            function place() {
                const moving = state.moving;
                if (!moving || !state.top) return;
                const info = overlapInfo(moving);
                const perfectLimit = Math.max(PERFECT_MIN, info.mw * PERFECT_FRACTION);
                if (Math.abs(info.delta) <= perfectLimit && info.overlap > MIN_OVERLAP) {
                    moving.group.position[info.axis] = info.pc;
                    settleColor(moving);
                    state.moving = null;
                    state.blocks.push(moving);
                    state.top = moving;
                    addStatic(moving);
                    punchBlock(moving, true);
                    succeed(true);
                    return;
                }
                if (info.overlap <= MIN_OVERLAP) {
                    miss(moving, info.mw <= MIN_OVERLAP ? 'narrow' : 'miss');
                    return;
                }
                const kept = info.overlap;
                const keptCenter = (info.left + info.right) / 2;
                const w = info.axis === 'x' ? kept : moving.width;
                const d = info.axis === 'z' ? kept : moving.depth;
                const placed = makeBlock(w, d, moving.level, false);
                placed.group.position.set(moving.group.position.x, moving.group.position.y, moving.group.position.z);
                placed.group.position[info.axis] = keptCenter;
                const hangRight = info.mc + info.mw / 2 - info.right;
                const hangLeft = info.left - (info.mc - info.mw / 2);
                let offSize = 0;
                let offCenter = 0;
                if (hangRight > hangLeft) {
                    offSize = hangRight;
                    offCenter = (info.right + info.mc + info.mw / 2) / 2;
                } else {
                    offSize = hangLeft;
                    offCenter = ((info.mc - info.mw / 2) + info.left) / 2;
                }
                const otherX = moving.group.position.x;
                const otherZ = moving.group.position.z;
                const chipY = moving.group.position.y;
                disposeBlock(moving);
                state.moving = null;
                state.blocks.push(placed);
                state.top = placed;
                addStatic(placed);
                punchBlock(placed, false);
                if (offSize > 0.04) {
                    const ow = info.axis === 'x' ? offSize : moving.width;
                    const od = info.axis === 'z' ? offSize : moving.depth;
                    const chip = makeBlock(ow, od, moving.level, false);
                    chip.group.position.set(
                        info.axis === 'x' ? offCenter : otherX,
                        chipY,
                        info.axis === 'z' ? offCenter : otherZ
                    );
                    releaseDynamic(chip);
                }
                succeed(false);
            }

            function scheduleResult() {
                clearTimeout(state.resultTimer);
                const delay = state.reduced ? 180 : RESULT_DELAY_MS;
                state.resultTimer = setTimeout(showResult, delay);
            }

            function epitaph(score) {
                if (state.missReason === 'narrow') return 'That course was too narrow to land.';
                if (score <= 0) return 'Tap as the floor crosses the tower.';
                if (score < 4) return 'The first courses are in.';
                if (score < 9) return 'The tower is finding its line.';
                if (score < 16) return 'A quiet, steady rise.';
                if (score < 25) return 'Well above the street.';
                return 'A spire in the night.';
            }

            function lockPlay(on) {
                topbarEl.inert = on;
                topbarEl.classList.toggle('locked', on);
            }

            function showResult() {
                if (state.active || state.resultShown) return;
                clearTimeout(state.resultTimer);
                const previous = state.best;
                if (state.score > previous) {
                    state.best = state.score;
                    saveBest(state.best);
                }
                finalScoreEl.textContent = String(state.score);
                finalNoteEl.textContent = epitaph(state.score);
                const meta = state.perfects === 1 ? '1 perfect floor' : (state.perfects > 1 ? state.perfects + ' perfect floors' : '');
                finalMetaEl.hidden = !meta;
                finalMetaEl.textContent = meta;
                const shownBest = Math.max(previous, state.score);
                let bestText = '';
                if (state.score > previous && state.score > 0) bestText = 'New best';
                else if (shownBest > 0) bestText = 'Best ' + shownBest;
                finalBestEl.hidden = !bestText;
                finalBestEl.textContent = bestText;
                if (state.best) bestEl.textContent = 'Best ' + state.best;
                resultEl.hidden = false;
                resultEl.classList.add('show');
                state.resultShown = true;
                lockPlay(true);
                resultEl.focus();
            }

            function teardownRun() {
                clearTimeout(state.resultTimer);
                clearTimeout(state.hintTimer);
                clearTimeout(state.calloutTimer);
                settles.length = 0;
                state.blocks.forEach(disposeBlock);
                state.rubble.forEach(disposeBlock);
                if (state.moving) disposeBlock(state.moving);
                if (state.plinth) {
                    scene.remove(state.plinth.mesh);
                    state.plinth.geo.dispose();
                    state.plinth.mat.dispose();
                }
                state.blocks = [];
                state.rubble = [];
                state.dynamics = [];
                state.moving = null;
                state.top = null;
                state.plinth = null;
            }

            function buildBase() {
                const geo = new THREE.BoxGeometry(5.2, 0.46, 5.2);
                const mat = new THREE.MeshPhongMaterial({ map: grain, color: '#2a241c', specular: '#8a7048', shininess: 28 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 0.23;
                scene.add(mesh);
                state.plinth = { mesh: mesh, geo: geo, mat: mat };
                const plinthBody = new CANNON.Body({ mass: 0 });
                plinthBody.addShape(new CANNON.Box(new CANNON.Vec3(2.6, 0.23, 2.6)));
                plinthBody.position.set(0, 0.23, 0);
                world.addBody(plinthBody);

                const base = makeBlock(4, 4, 0, false);
                base.group.position.y = 0.96;
                state.blocks.push(base);
                state.top = base;
                addStatic(base);
                updateContact();
            }

            function startRun() {
                teardownRun();
                resetWorld();
                state.score = 0;
                state.perfects = 0;
                state.streak = 0;
                state.speed = SPEED_START;
                state.active = true;
                state.resultShown = false;
                state.missReason = '';
                state.acc = 0;
                state.kick = 0;
                paintScore(false);
                calloutEl.classList.remove('show');
                calloutEl.textContent = '';
                hintEl.hidden = false;
                hintEl.textContent = state.introSeen ? 'Watch the floor' : 'Watch the floor slide in';
                resultEl.classList.remove('show');
                resultEl.hidden = true;
                lockPlay(false);
                if (document.activeElement === againEl || document.activeElement === resultEl) {
                    resultEl.blur();
                }
                const now = performance.now();
                state.inputOpenAt = now + OPENING_MS;
                state.windupUntil = now + OPENING_MS;
                buildBase();
                snapCamera();
                spawnMover();
                if (!rafId) {
                    lastT = 0;
                    frame(performance.now());
                }
            }

            function frame(t) {
                rafId = requestAnimationFrame(frame);
                const dt = Math.min(0.05, lastT ? (t - lastT) / 1000 : 1 / 60);
                lastT = t;
                if (state.active) updateMover(dt);
                updateSettles();
                updateCamera(dt);
                updateDynamics(dt);
                applyKick(dt);
                renderer.render(scene, camera);
                if (!state.active && state.dynamics.length === 0 && state.resultShown) {
                    cancelAnimationFrame(rafId);
                    rafId = 0;
                    lastT = 0;
                }
            }

            function onPointerDown(e) {
                if (!e.isPrimary || e.button !== 0) return;
                if (e.target.closest && e.target.closest('button, a')) return;
                e.preventDefault();
                if (!state.muted) {
                    try { audio(); } catch (err) {}
                }
                if (!state.active) {
                    if (!state.resultShown) showResult();
                    return;
                }
                if (!state.moving || !state.moving.armed) return;
                place();
            }

            function onKeyDown(e) {
                if (e.repeat) return;
                if (e.code === 'KeyM') {
                    e.preventDefault();
                    toggleMute();
                    return;
                }
                if (e.code === 'KeyF') {
                    e.preventDefault();
                    toggleFullscreen();
                    return;
                }
                if (e.target && e.target.closest && e.target.closest('button, a')) return;
                if (e.code !== 'Space' && e.code !== 'Enter' && e.code !== 'KeyR') return;
                if (e.code === 'KeyR' && state.active) return;
                e.preventDefault();
                if (!state.active) {
                    if (!state.resultShown) showResult();
                    else startRun();
                    return;
                }
                if (!state.muted) {
                    try { audio(); } catch (err) {}
                }
                if (!state.moving || !state.moving.armed) return;
                place();
            }

            function onContextMenu(e) {
                if (e.target.closest && e.target.closest('button, a')) return;
                e.preventDefault();
            }

            function syncMute() {
                muteEl.setAttribute('aria-pressed', state.muted ? 'true' : 'false');
                muteEl.setAttribute('aria-label', state.muted ? 'Unmute sound' : 'Mute sound');
                muteEl.querySelector('.sound-on').hidden = state.muted;
                muteEl.querySelector('.sound-off').hidden = !state.muted;
            }

            function toggleMute() {
                state.muted = !state.muted;
                saveFlag(MUTE_KEY, state.muted);
                syncMute();
                if (!state.muted) {
                    try { audio(); } catch (err) {}
                }
            }

            function syncFullscreen() {
                const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
                fullEl.setAttribute('aria-pressed', on ? 'true' : 'false');
                fullEl.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Enter fullscreen');
                fullEl.querySelector('.fs-enter').hidden = on;
                fullEl.querySelector('.fs-exit').hidden = !on;
            }

            function toggleFullscreen() {
                const root = document.documentElement;
                const on = document.fullscreenElement || document.webkitFullscreenElement;
                let pending;
                try {
                    if (on) {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        pending = exit ? exit.call(document) : null;
                    } else {
                        const request = root.requestFullscreen || root.webkitRequestFullscreen;
                        pending = request ? request.call(root) : null;
                    }
                } catch (err) {
                    pending = null;
                }
                Promise.resolve(pending).then(syncFullscreen, syncFullscreen);
            }

            function onResize() {
                if (!renderer) return;
                layoutCamera();
                if (!rafId && scene && camera) renderer.render(scene, camera);
            }

            function init() {
                readMotion();
                const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
                if (motion.addEventListener) motion.addEventListener('change', readMotion);
                const fine = window.matchMedia('(hover: hover) and (pointer: fine)');
                state.placeHint = fine.matches ? 'Tap or press Space when it lines up' : 'Tap when it lines up';
                state.best = loadBest();
                state.muted = loadFlag(MUTE_KEY);
                state.introSeen = loadFlag(INTRO_KEY);
                syncMute();
                if (state.best) bestEl.textContent = 'Best ' + state.best;
                if (state.introSeen) hintEl.textContent = 'Watch the floor';

                scene = new THREE.Scene();
                scene.background = makeSky();
                scene.fog = new THREE.Fog(0x12151c, 32, 70);
                camera = new THREE.OrthographicCamera(-8, 8, 8, -8, 0.1, 400);
                look = new THREE.Vector3();
                lookTo = new THREE.Vector3();
                camTo = new THREE.Vector3();
                sampleA = new THREE.Vector3();
                emissiveOff = new THREE.Color(0x000000);
                emissiveLock = new THREE.Color(0x3a2810);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
                renderer.setClearColor(0x05070d, 1);
                renderer.domElement.style.position = 'fixed';
                renderer.domElement.style.inset = '0';
                renderer.domElement.style.zIndex = '0';
                renderer.domElement.style.touchAction = 'none';
                renderer.domElement.setAttribute('aria-hidden', 'true');
                document.body.insertBefore(renderer.domElement, document.body.firstChild);
                renderer.domElement.addEventListener('webglcontextlost', (event) => {
                    event.preventDefault();
                    cancelAnimationFrame(rafId);
                    rafId = 0;
                    showStatus('Vellura Towers lost the 3D view. Reload the page to keep building.');
                });

                grain = makeGrain();
                grain.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
                jointMat = new THREE.MeshPhongMaterial({
                    color: '#e0b15a',
                    emissive: '#6b4a18',
                    specular: '#f4e0b0',
                    shininess: 52
                });

                scene.add(new THREE.HemisphereLight(0x9aabcc, 0x1a120c, 0.46));
                const sun = new THREE.DirectionalLight(0xffe0b0, 0.95);
                sun.position.set(18, 28, 10);
                scene.add(sun);
                const fill = new THREE.DirectionalLight(0x7d8eae, 0.5);
                fill.position.set(-14, 10, -8);
                scene.add(fill);

                groundMesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(180, 180),
                    new THREE.MeshLambertMaterial({ color: '#101218' })
                );
                groundMesh.rotation.x = -Math.PI / 2;
                groundMesh.position.y = 0;
                scene.add(groundMesh);

                ember = new THREE.Mesh(
                    new THREE.PlaneGeometry(1, 1),
                    new THREE.MeshBasicMaterial({
                        map: makeGlowTexture(),
                        transparent: true,
                        depthWrite: false,
                        blending: THREE.AdditiveBlending
                    })
                );
                ember.rotation.x = -Math.PI / 2;
                ember.position.y = 0.02;
                ember.scale.set(18, 18, 1);
                ember.renderOrder = 1;
                scene.add(ember);

                const shadowTex = makeShadowTexture();
                contactShadow = new THREE.Mesh(
                    new THREE.PlaneGeometry(1, 1),
                    new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
                );
                contactShadow.rotation.x = -Math.PI / 2;
                contactShadow.position.y = 0.04;
                contactShadow.scale.set(8.5, 8.5, 1);
                contactShadow.renderOrder = 2;
                scene.add(contactShadow);

                aimShadow = new THREE.Mesh(
                    new THREE.PlaneGeometry(1, 1),
                    new THREE.MeshBasicMaterial({ map: makeAimTexture(), transparent: true, depthWrite: false, opacity: 0.35 })
                );
                aimShadow.rotation.x = -Math.PI / 2;
                aimShadow.renderOrder = 3;
                aimShadow.visible = false;
                scene.add(aimShadow);

                layoutCamera();
                window.addEventListener('resize', onResize);
                if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
                window.addEventListener('pageshow', onResize);
                window.addEventListener('pointerdown', onPointerDown, { passive: false });
                window.addEventListener('keydown', onKeyDown);
                window.addEventListener('contextmenu', onContextMenu);
                document.addEventListener('fullscreenchange', syncFullscreen);
                document.addEventListener('webkitfullscreenchange', syncFullscreen);
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) return;
                    if (state.active && !rafId) {
                        lastT = 0;
                        frame(performance.now());
                    } else {
                        onResize();
                    }
                });
                againEl.addEventListener('click', startRun);
                muteEl.addEventListener('click', toggleMute);
                fullEl.addEventListener('click', toggleFullscreen);
                startRun();
                statusEl.hidden = true;
            }

            if (!window.THREE || !window.CANNON) {
                showStatus('Vellura Towers could not start. The 3D libraries failed to load. Reload the page.');
            } else {
                try {
                    init();
                } catch (err) {
                    showStatus('Vellura Towers could not start. This browser could not create the 3D view.');
                }
            }
        }());
    </script>
</body>
</html>
