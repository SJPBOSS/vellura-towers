<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Vellura Towers | Architecture Stacker</title>
    <meta name="description" content="Stack each limestone floor of Vellura Towers before it slides past the last. A quiet browser game of timing.">
    <meta name="theme-color" content="#c9c3b8">
    <link rel="canonical" href="https://www.velluratowers.com/">
    <meta property="og:title" content="Vellura Towers">
    <meta property="og:description" content="Stack each limestone floor of Vellura Towers before it slides past the last. A quiet browser game of timing.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.velluratowers.com/">
    <meta property="og:image" content="https://www.velluratowers.com/og.png">
    <meta property="og:image:alt" content="A small limestone tower of stacked floors on a warm ground.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Vellura Towers">
    <meta name="twitter:description" content="Stack each limestone floor of Vellura Towers before it slides past the last. A quiet browser game of timing.">
    <meta name="twitter:image" content="https://www.velluratowers.com/og.png">
    <style>
        :root {
            --ink: #2c2924;
            --muted: #4e483f;
            --paper: #f3eee6;
            --line: #ddd4c6;
            --ground: #c9c3b8;
            --serif: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
            --sans: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--ground);
            color: var(--ink);
            font-family: var(--sans);
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        #wordmark {
            position: absolute;
            z-index: 2;
            top: calc(14px + env(safe-area-inset-top));
            left: calc(12px + env(safe-area-inset-left));
            right: calc(12px + env(safe-area-inset-right));
            margin: 0;
            text-align: center;
            font-family: var(--serif);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            pointer-events: none;
        }

        #hud {
            position: absolute;
            z-index: 2;
            top: calc(40px + env(safe-area-inset-top));
            left: 0;
            right: 0;
            text-align: center;
            pointer-events: none;
        }

        #score {
            font-family: var(--serif);
            font-size: clamp(44px, 11vw, 68px);
            font-weight: 600;
            line-height: 0.9;
            opacity: 0.92;
        }

        #score-label, #best {
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        #score-label { margin-top: 4px; }

        #best { margin-top: 2px; min-height: 1em; }

        #hint, #status {
            position: absolute;
            z-index: 2;
            left: calc(16px + env(safe-area-inset-left));
            right: calc(16px + env(safe-area-inset-right));
            text-align: center;
        }

        #hint {
            bottom: calc(22px + env(safe-area-inset-bottom));
            margin: 0;
            font-size: 15px;
            color: var(--ink);
            pointer-events: none;
        }

        #hint[hidden] { display: none; }

        #status {
            z-index: 6;
            inset: 0;
            display: grid;
            place-items: center;
            margin: 0;
            padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
            background: var(--ground);
            font-size: 16px;
            line-height: 1.45;
        }

        #status[hidden] { display: none !important; }

        #result {
            display: none;
            position: absolute;
            z-index: 5;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(340px, calc(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right)));
            padding: 28px 22px 20px;
            background: var(--paper);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 12px;
            text-align: center;
        }

        #result.show { display: block; }

        #result-title {
            margin: 0 0 8px;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        #final-score {
            margin: 0;
            font-family: var(--serif);
            font-size: clamp(52px, 16vw, 72px);
            font-weight: 600;
            line-height: 0.9;
        }

        #final-best {
            margin: 10px 0 20px;
            font-size: 14px;
            color: var(--muted);
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 8px;
            padding: 14px 16px;
            background: #3e463f;
            color: #f6f1e8;
            font: 600 15px/1 var(--sans);
            letter-spacing: 0.02em;
            cursor: pointer;
        }

        button:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 3px;
        }

        @media (max-height: 520px) {
            #wordmark { font-size: 11px; top: calc(8px + env(safe-area-inset-top)); }
            #hud { top: calc(26px + env(safe-area-inset-top)); }
            #score { font-size: 36px; }
            #hint { bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 13px; }
        }

        @media (prefers-reduced-motion: reduce) {
            #result, #hint, #status, button { transition: none; }
        }
    </style>
</head>
<body>
    <h1 id="wordmark">Vellura Towers</h1>
    <div id="hud">
        <div id="score" aria-live="polite">0</div>
        <div id="score-label">Floors</div>
        <div id="best"></div>
    </div>
    <p id="hint">Watch the floor</p>
    <p id="status" role="status">Loading Vellura Towers…</p>
    <div id="result" role="dialog" aria-labelledby="result-title">
        <p id="result-title">The floor missed</p>
        <p id="final-score">0</p>
        <p id="final-best"></p>
        <button type="button" id="again">Build again</button>
    </div>
    <noscript>Vellura Towers needs JavaScript to build the tower.</noscript>
    <script>
        (function () {
            const SPEED_START = 8.2;
            const SPEED_STEP = 0.26;
            const SPEED_CAP = 13.5;
            const PERFECT_FRACTION = 0.12;
            const PERFECT_MIN = 0.24;
            const MIN_OVERLAP = 0.18;
            const OPENING_MS = 1000;
            const APPROACH_LOCK_MS = 200;
            const RESULT_DELAY_MS = 700;
            const SETBACK_EVERY = 5;
            const SETBACK_SCALE = 0.88;
            const BEST_KEY = 'vellura-towers-best';
            const THREE_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
            const CANNON_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js';

            const scoreEl = document.getElementById('score');
            const bestEl = document.getElementById('best');
            const hintEl = document.getElementById('hint');
            const statusEl = document.getElementById('status');
            const resultEl = document.getElementById('result');
            const finalScoreEl = document.getElementById('final-score');
            const finalBestEl = document.getElementById('final-best');
            const againEl = document.getElementById('again');

            const state = {
                score: 0,
                best: 0,
                active: false,
                speed: SPEED_START,
                inputOpenAt: 0,
                windupUntil: 0,
                top: null,
                moving: null,
                blocks: [],
                rubble: [],
                dynamics: [],
                plinth: null,
                resultShown: false,
                resultTimer: 0,
                acc: 0,
                reduced: false
            };

            const pointers = new Set();
            let world, scene, camera, renderer;
            let grain, jointMat, groundMesh, contactShadow, aimShadow;
            let look, lookTo, camTo, sampleA;
            let rafId = 0;
            let lastT = 0;
            let audioCtx = null;

            function loadBest() {
                try {
                    const n = Number(localStorage.getItem(BEST_KEY));
                    return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
                } catch (err) {
                    return 0;
                }
            }

            function saveBest(value) {
                try { localStorage.setItem(BEST_KEY, String(value)); } catch (err) {}
            }

            function showStatus(message) {
                statusEl.hidden = false;
                statusEl.textContent = message;
            }

            function loadScript(src) {
                return new Promise((resolve, reject) => {
                    const el = document.createElement('script');
                    el.src = src;
                    el.async = true;
                    el.onload = () => resolve();
                    el.onerror = () => reject(new Error(src));
                    document.head.appendChild(el);
                });
            }

            function readMotion() {
                state.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            }

            function stoneColor(level, moving) {
                const color = new THREE.Color('#e6dac8');
                color.offsetHSL(0.008, -0.04, -Math.min(0.07, level * 0.0035));
                if (moving) color.offsetHSL(0, 0, 0.045);
                return color;
            }

            function makeGrain() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const g = canvas.getContext('2d');
                g.fillStyle = '#ffffff';
                g.fillRect(0, 0, 128, 128);
                for (let i = 0; i < 1600; i++) {
                    const v = 70 + Math.random() * 40;
                    g.fillStyle = 'rgba(' + v + ',' + (v - 6) + ',' + (v - 16) + ',' + (0.03 + Math.random() * 0.06) + ')';
                    g.fillRect(Math.random() * 128, Math.random() * 128, 1 + Math.random() * 1.6, 1);
                }
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                return tex;
            }

            function makeShadowTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const g = canvas.getContext('2d');
                const fade = g.createRadialGradient(64, 64, 8, 64, 64, 64);
                fade.addColorStop(0, 'rgba(48, 40, 32, 0.34)');
                fade.addColorStop(0.5, 'rgba(48, 40, 32, 0.14)');
                fade.addColorStop(1, 'rgba(48, 40, 32, 0)');
                g.fillStyle = fade;
                g.fillRect(0, 0, 128, 128);
                return new THREE.CanvasTexture(canvas);
            }

            function makeBlock(w, d, level, moving) {
                const stepped = level > 0 && level % SETBACK_EVERY === 0;
                const jointH = stepped ? 0.15 : 0.07;
                const slabH = 1 - jointH;
                const group = new THREE.Group();
                const slabMat = new THREE.MeshLambertMaterial({ map: grain, color: stoneColor(level, moving) });
                const slabGeo = new THREE.BoxGeometry(w, slabH, d);
                const slab = new THREE.Mesh(slabGeo, slabMat);
                slab.position.y = jointH / 2;
                const jointGeo = new THREE.BoxGeometry(w * 0.985, jointH, d * 0.985);
                const joint = new THREE.Mesh(jointGeo, jointMat);
                joint.position.y = -0.5 + jointH / 2;
                group.add(slab);
                group.add(joint);
                scene.add(group);
                return {
                    group: group,
                    width: w,
                    depth: d,
                    height: 1,
                    level: level,
                    geos: [slabGeo, jointGeo],
                    mats: [slabMat]
                };
            }

            function settleColor(block) {
                block.group.children[0].material.color.copy(stoneColor(block.level, false));
            }

            function disposeBlock(block) {
                if (!block) return;
                scene.remove(block.group);
                block.geos.forEach((geo) => geo.dispose());
                block.mats.forEach((mat) => mat.dispose());
            }

            function resetWorld() {
                world = new CANNON.World();
                world.gravity.set(0, -18, 0);
                world.solver.iterations = 8;
                world.allowSleep = true;
                const groundBody = new CANNON.Body({ mass: 0 });
                groundBody.addShape(new CANNON.Plane());
                groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
                world.addBody(groundBody);
            }

            function addStatic(block) {
                const body = new CANNON.Body({ mass: 0 });
                body.addShape(new CANNON.Box(new CANNON.Vec3(block.width / 2, block.height / 2, block.depth / 2)));
                body.position.set(block.group.position.x, block.group.position.y, block.group.position.z);
                world.addBody(body);
                block.body = body;
            }

            function releaseDynamic(block) {
                const body = new CANNON.Body({ mass: 3.2, linearDamping: 0.1, angularDamping: 0.32 });
                body.addShape(new CANNON.Box(new CANNON.Vec3(block.width / 2, block.height / 2, block.depth / 2)));
                body.position.set(block.group.position.x, block.group.position.y, block.group.position.z);
                body.quaternion.set(block.group.quaternion.x, block.group.quaternion.y, block.group.quaternion.z, block.group.quaternion.w);
                const awayX = block.group.position.x;
                const awayZ = block.group.position.z;
                const away = Math.hypot(awayX, awayZ) || 1;
                body.velocity.set((awayX / away) * 1.6, 0.15, (awayZ / away) * 1.6);
                body.angularVelocity.set((Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 1.5);
                body.allowSleep = true;
                body.sleepSpeedLimit = 0.28;
                body.sleepTimeLimit = 0.45;
                world.addBody(body);
                state.dynamics.push({ body: body, block: block, born: performance.now() });
                state.rubble.push(block);
            }

            function layoutCamera() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const shortSide = Math.min(w, h);
                const slabPx = THREE.Math.clamp(shortSide * 0.36, 108, 260);
                const pixelsPerUnit = slabPx / 4;
                const d = (h / pixelsPerUnit) / 2;
                const aspect = w / Math.max(h, 1);
                camera.top = d;
                camera.bottom = -d;
                camera.left = -d * aspect;
                camera.right = d * aspect;
                camera.updateProjectionMatrix();
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.setSize(w, h);
            }

            function focusPoint(target) {
                const top = state.top;
                if (!top) {
                    target.set(0, 1.4, 0);
                    return target;
                }
                target.set(top.group.position.x, top.group.position.y + 0.85, top.group.position.z);
                return target;
            }

            function snapCamera() {
                focusPoint(look);
                camera.position.set(look.x + 11, look.y + 10.5, look.z + 11);
                camera.lookAt(look);
                lookTo.copy(look);
            }

            function updateCamera(dt) {
                focusPoint(lookTo);
                camTo.set(lookTo.x + 11, lookTo.y + 10.5, lookTo.z + 11);
                if (state.reduced) {
                    look.copy(lookTo);
                    camera.position.copy(camTo);
                } else {
                    const k = 1 - Math.exp(-Math.max(dt, 0.016) * 4.5);
                    look.lerp(lookTo, k);
                    camera.position.lerp(camTo, k);
                }
                camera.lookAt(look);
            }

            function withinFrame(block, axis, offset) {
                const top = state.top.group.position;
                const x = axis === 'x' ? top.x + offset : block.group.position.x;
                const z = axis === 'z' ? top.z + offset : block.group.position.z;
                const y = block.group.position.y;
                const hw = block.width / 2;
                const hd = block.depth / 2;
                camera.updateMatrixWorld(true);
                for (let ix = 0; ix < 2; ix++) {
                    for (let iy = 0; iy < 2; iy++) {
                        for (let iz = 0; iz < 2; iz++) {
                            sampleA.set(x + (ix ? hw : -hw), y + (iy ? 0.5 : -0.5), z + (iz ? hd : -hd));
                            sampleA.project(camera);
                            if (Math.abs(sampleA.x) > 0.92 || Math.abs(sampleA.y) > 0.92) return false;
                        }
                    }
                }
                return true;
            }

            function travelLimit(block) {
                const axis = block.axis;
                const span = axis === 'x' ? block.width : block.depth;
                const clear = span + 1.15;
                const missAt = Math.max(span * 0.55 + 0.4, span - MIN_OVERLAP + 0.08);
                let lo = 0;
                let hi = clear;
                for (let i = 0; i < 7; i++) {
                    const mid = (lo + hi) / 2;
                    if (withinFrame(block, axis, mid) && withinFrame(block, axis, -mid)) lo = mid;
                    else hi = mid;
                }
                if (lo >= missAt) return Math.min(clear, lo);
                return Math.min(clear, missAt);
            }

            function overlapInfo(moving) {
                const axis = moving.axis;
                const prev = state.top;
                const pw = axis === 'x' ? prev.width : prev.depth;
                const mw = axis === 'x' ? moving.width : moving.depth;
                const pc = prev.group.position[axis];
                const mc = moving.group.position[axis];
                const left = Math.max(pc - pw / 2, mc - mw / 2);
                const right = Math.min(pc + pw / 2, mc + mw / 2);
                return {
                    axis: axis,
                    pw: pw,
                    mw: mw,
                    pc: pc,
                    mc: mc,
                    left: left,
                    right: right,
                    overlap: right - left,
                    delta: mc - pc
                };
            }

            function spawnMover() {
                let w = state.top.width;
                let d = state.top.depth;
                const level = state.score;
                if (level > 0 && level % SETBACK_EVERY === 0) {
                    w *= SETBACK_SCALE;
                    d *= SETBACK_SCALE;
                }
                const block = makeBlock(w, d, level, true);
                const axis = level % 2 === 0 ? 'x' : 'z';
                const dir = level % 2 === 0 ? 1 : -1;
                block.axis = axis;
                block.group.position.set(state.top.group.position.x, state.top.group.position.y + 1, state.top.group.position.z);
                const span = axis === 'x' ? w : d;
                const limit = travelLimit(block);
                block.group.position[axis] = state.top.group.position[axis] - dir * limit;
                block.dir = dir;
                block.armed = false;
                block.seen = false;
                block.readyAt = performance.now() + APPROACH_LOCK_MS;
                state.moving = block;
                if (level === 0) {
                    const outside = Math.max(0.2, limit - span);
                    const approachMs = (outside / state.speed) * 1000;
                    state.windupUntil = state.inputOpenAt - approachMs;
                }
            }

            function positionAimShadow(moving) {
                const topY = state.top.group.position.y + state.top.height / 2;
                aimShadow.position.set(moving.group.position.x, topY + 0.035, moving.group.position.z);
                aimShadow.scale.set(moving.width, moving.depth, 1);
                aimShadow.visible = true;
            }

            function updateMover(dt) {
                const moving = state.moving;
                if (!moving || !state.top) {
                    aimShadow.visible = false;
                    return;
                }
                const axis = moving.axis;
                const center = state.top.group.position[axis];
                const span = axis === 'x' ? moving.width : moving.depth;
                const limit = travelLimit(moving);
                const hold = state.score === 0 && performance.now() < state.windupUntil;
                if (hold) {
                    moving.group.position[axis] = center - moving.dir * limit;
                } else {
                    let pos = moving.group.position[axis] + moving.dir * state.speed * dt;
                    const max = center + limit;
                    const min = center - limit;
                    if (pos >= max) {
                        pos = max;
                        moving.dir = -1;
                    } else if (pos <= min) {
                        pos = min;
                        moving.dir = 1;
                    }
                    moving.group.position[axis] = pos;
                }
                const info = overlapInfo(moving);
                const gate = state.score === 0 ? state.inputOpenAt : moving.readyAt;
                if (info.overlap > MIN_OVERLAP) moving.seen = true;
                const tooThin = info.mw <= MIN_OVERLAP;
                if (performance.now() >= gate && (moving.seen || tooThin)) moving.armed = true;
                const closeness = 1 - Math.min(1, Math.abs(info.delta) / Math.max(span, 0.001));
                aimShadow.material.opacity = 0.05 + closeness * 0.2;
                positionAimShadow(moving);
                if (state.score === 0 && state.active) {
                    const next = performance.now() < state.inputOpenAt ? 'Watch the floor' : 'Tap to place the floor';
                    if (hintEl.textContent !== next) hintEl.textContent = next;
                }
            }

            function updateDynamics(dt) {
                if (!state.dynamics.length) return;
                state.acc += dt;
                let steps = 0;
                while (state.acc >= 1 / 60 && steps < 3) {
                    world.step(1 / 60);
                    state.acc -= 1 / 60;
                    steps += 1;
                }
                if (steps === 3) state.acc = 0;
                for (let i = state.dynamics.length - 1; i >= 0; i--) {
                    const item = state.dynamics[i];
                    const p = item.body.position;
                    const q = item.body.quaternion;
                    item.block.group.position.set(p.x, p.y, p.z);
                    item.block.group.quaternion.set(q.x, q.y, q.z, q.w);
                    const v = item.body.velocity;
                    const speed2 = v.x * v.x + v.y * v.y + v.z * v.z;
                    if (speed2 < 0.25) item.still = (item.still || 0) + dt;
                    else item.still = 0;
                    const asleep = item.body.sleepState === CANNON.Body.SLEEPING || item.still > 0.7;
                    const lost = p.y < -4 || performance.now() - item.born > 6000;
                    if (asleep || lost) {
                        world.removeBody(item.body);
                        state.dynamics.splice(i, 1);
                        if (lost) disposeBlock(item.block);
                    }
                }
            }

            function audio() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return audioCtx;
            }

            function noiseBurst(freq, dur, gainValue) {
                const ctx = audio();
                const count = Math.max(1, Math.floor(ctx.sampleRate * dur));
                const buffer = ctx.createBuffer(1, count, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    const env = 1 - i / data.length;
                    data[i] = (Math.random() * 2 - 1) * env * env;
                }
                const src = ctx.createBufferSource();
                src.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = freq;
                const gain = ctx.createGain();
                gain.gain.value = gainValue;
                src.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                src.start();
            }

            function tone(freq, dur, gainValue) {
                const ctx = audio();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(gainValue, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + dur);
            }

            function playPlace(perfect) {
                try {
                    noiseBurst(perfect ? 1600 : 780, perfect ? 0.07 : 0.05, perfect ? 0.16 : 0.2);
                    tone(perfect ? 620 : 186, perfect ? 0.12 : 0.08, perfect ? 0.045 : 0.06);
                } catch (err) {}
            }

            function playMiss() {
                try {
                    noiseBurst(240, 0.16, 0.28);
                    tone(92, 0.2, 0.08);
                } catch (err) {}
            }

            function buzz(ms) {
                if (state.reduced || !navigator.vibrate) return;
                try { navigator.vibrate(ms); } catch (err) {}
            }

            function succeed(perfect) {
                state.score += 1;
                scoreEl.textContent = String(state.score);
                hintEl.hidden = true;
                state.speed = Math.min(SPEED_CAP, SPEED_START + state.score * SPEED_STEP);
                playPlace(perfect);
                buzz(perfect ? 14 : 8);
                spawnMover();
            }

            function miss(block) {
                state.active = false;
                state.moving = null;
                hintEl.hidden = true;
                aimShadow.visible = false;
                releaseDynamic(block);
                playMiss();
                buzz(28);
                scheduleResult();
            }

            function place() {
                const moving = state.moving;
                if (!moving || !state.top) return;
                const info = overlapInfo(moving);
                const perfectLimit = Math.max(PERFECT_MIN, info.mw * PERFECT_FRACTION);
                if (Math.abs(info.delta) <= perfectLimit && info.overlap > MIN_OVERLAP) {
                    moving.group.position[info.axis] = info.pc;
                    settleColor(moving);
                    state.moving = null;
                    state.blocks.push(moving);
                    state.top = moving;
                    addStatic(moving);
                    succeed(true);
                    return;
                }
                if (info.overlap <= MIN_OVERLAP) {
                    miss(moving);
                    return;
                }
                const kept = info.overlap;
                const keptCenter = (info.left + info.right) / 2;
                const w = info.axis === 'x' ? kept : moving.width;
                const d = info.axis === 'z' ? kept : moving.depth;
                const placed = makeBlock(w, d, moving.level, false);
                placed.group.position.set(moving.group.position.x, moving.group.position.y, moving.group.position.z);
                placed.group.position[info.axis] = keptCenter;
                const hangRight = info.mc + info.mw / 2 - info.right;
                const hangLeft = info.left - (info.mc - info.mw / 2);
                let offSize = 0;
                let offCenter = 0;
                if (hangRight > hangLeft) {
                    offSize = hangRight;
                    offCenter = (info.right + info.mc + info.mw / 2) / 2;
                } else {
                    offSize = hangLeft;
                    offCenter = ((info.mc - info.mw / 2) + info.left) / 2;
                }
                const otherX = moving.group.position.x;
                const otherZ = moving.group.position.z;
                const chipY = moving.group.position.y;
                disposeBlock(moving);
                state.moving = null;
                state.blocks.push(placed);
                state.top = placed;
                addStatic(placed);
                if (offSize > 0.04) {
                    const ow = info.axis === 'x' ? offSize : moving.width;
                    const od = info.axis === 'z' ? offSize : moving.depth;
                    const chip = makeBlock(ow, od, moving.level, false);
                    chip.group.position.set(
                        info.axis === 'x' ? offCenter : otherX,
                        chipY,
                        info.axis === 'z' ? offCenter : otherZ
                    );
                    releaseDynamic(chip);
                }
                succeed(false);
            }

            function scheduleResult() {
                clearTimeout(state.resultTimer);
                const delay = state.reduced ? 180 : RESULT_DELAY_MS;
                state.resultTimer = setTimeout(showResult, delay);
            }

            function showResult() {
                if (state.active) return;
                const previous = state.best;
                if (state.score > previous) {
                    state.best = state.score;
                    saveBest(state.best);
                }
                finalScoreEl.textContent = String(state.score);
                const shownBest = Math.max(previous, state.score);
                if (state.score > previous && state.score > 0) finalBestEl.textContent = 'New best';
                else if (shownBest > 0) finalBestEl.textContent = 'Best ' + shownBest;
                else finalBestEl.textContent = '';
                if (state.best) bestEl.textContent = 'Best ' + state.best;
                resultEl.classList.add('show');
                state.resultShown = true;
            }

            function teardownRun() {
                clearTimeout(state.resultTimer);
                state.blocks.forEach(disposeBlock);
                state.rubble.forEach(disposeBlock);
                if (state.moving) disposeBlock(state.moving);
                if (state.plinth) {
                    scene.remove(state.plinth.mesh);
                    state.plinth.geo.dispose();
                    state.plinth.mat.dispose();
                }
                state.blocks = [];
                state.rubble = [];
                state.dynamics = [];
                state.moving = null;
                state.top = null;
                state.plinth = null;
            }

            function buildBase() {
                const geo = new THREE.BoxGeometry(5.2, 0.46, 5.2);
                const mat = new THREE.MeshLambertMaterial({ map: grain, color: '#d3c6b4' });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 0.23;
                scene.add(mesh);
                state.plinth = { mesh: mesh, geo: geo, mat: mat };
                const plinthBody = new CANNON.Body({ mass: 0 });
                plinthBody.addShape(new CANNON.Box(new CANNON.Vec3(2.6, 0.23, 2.6)));
                plinthBody.position.set(0, 0.23, 0);
                world.addBody(plinthBody);

                const base = makeBlock(4, 4, 0, false);
                base.group.position.y = 0.96;
                state.blocks.push(base);
                state.top = base;
                addStatic(base);
                contactShadow.position.set(0, 0.035, 0);
            }

            function startRun() {
                teardownRun();
                resetWorld();
                state.score = 0;
                state.speed = SPEED_START;
                state.active = true;
                state.resultShown = false;
                state.acc = 0;
                scoreEl.textContent = '0';
                hintEl.hidden = false;
                hintEl.textContent = 'Watch the floor';
                resultEl.classList.remove('show');
                const now = performance.now();
                state.inputOpenAt = now + OPENING_MS;
                state.windupUntil = now + OPENING_MS;
                buildBase();
                snapCamera();
                spawnMover();
                if (!rafId) {
                    lastT = 0;
                    frame(performance.now());
                }
            }

            function frame(t) {
                rafId = requestAnimationFrame(frame);
                const dt = Math.min(0.05, lastT ? (t - lastT) / 1000 : 1 / 60);
                lastT = t;
                if (state.active) updateMover(dt);
                updateCamera(dt);
                updateDynamics(dt);
                renderer.render(scene, camera);
                if (!state.active && state.dynamics.length === 0 && state.resultShown) {
                    cancelAnimationFrame(rafId);
                    rafId = 0;
                    lastT = 0;
                }
            }

            function onPointerDown(e) {
                pointers.add(e.pointerId);
                if (e.button !== 0) return;
                if (e.target.closest && e.target.closest('button, a')) return;
                if (pointers.size > 1) return;
                e.preventDefault();
                try { audio(); } catch (err) {}
                if (!state.active || !state.moving || !state.moving.armed) return;
                place();
            }

            function onPointerUp(e) {
                pointers.delete(e.pointerId);
            }

            function onResize() {
                if (!renderer) return;
                layoutCamera();
                if (!rafId && scene && camera) renderer.render(scene, camera);
            }

            function init() {
                readMotion();
                const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
                if (motion.addEventListener) motion.addEventListener('change', readMotion);
                state.best = loadBest();
                if (state.best) bestEl.textContent = 'Best ' + state.best;

                scene = new THREE.Scene();
                scene.background = new THREE.Color('#c9c3b8');
                scene.fog = new THREE.Fog(0xc9c3b8, 26, 72);
                camera = new THREE.OrthographicCamera(-8, 8, 8, -8, 0.1, 400);
                look = new THREE.Vector3();
                lookTo = new THREE.Vector3();
                camTo = new THREE.Vector3();
                sampleA = new THREE.Vector3();

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
                renderer.setClearColor(0xc9c3b8, 1);
                renderer.domElement.style.position = 'fixed';
                renderer.domElement.style.inset = '0';
                renderer.domElement.style.zIndex = '0';
                renderer.domElement.style.touchAction = 'manipulation';
                document.body.appendChild(renderer.domElement);

                grain = makeGrain();
                grain.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
                jointMat = new THREE.MeshLambertMaterial({ color: '#b5a790' });

                scene.add(new THREE.HemisphereLight(0xf4efe6, 0x8d887e, 0.78));
                const sun = new THREE.DirectionalLight(0xfff6ea, 0.52);
                sun.position.set(16, 24, 8);
                scene.add(sun);

                groundMesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(180, 180),
                    new THREE.MeshLambertMaterial({ color: '#a39e93' })
                );
                groundMesh.rotation.x = -Math.PI / 2;
                groundMesh.position.y = 0;
                scene.add(groundMesh);

                const shadowTex = makeShadowTexture();
                contactShadow = new THREE.Mesh(
                    new THREE.PlaneGeometry(1, 1),
                    new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
                );
                contactShadow.rotation.x = -Math.PI / 2;
                contactShadow.position.y = 0.035;
                contactShadow.scale.set(10.5, 10.5, 1);
                contactShadow.renderOrder = 2;
                scene.add(contactShadow);

                aimShadow = new THREE.Mesh(
                    new THREE.PlaneGeometry(1, 1),
                    new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, opacity: 0.12 })
                );
                aimShadow.rotation.x = -Math.PI / 2;
                aimShadow.renderOrder = 3;
                aimShadow.visible = false;
                scene.add(aimShadow);

                layoutCamera();
                window.addEventListener('resize', onResize);
                window.addEventListener('pointerdown', onPointerDown, { passive: false });
                window.addEventListener('pointerup', onPointerUp);
                window.addEventListener('pointercancel', onPointerUp);
                againEl.addEventListener('click', startRun);
                startRun();
                statusEl.hidden = true;
            }

            let bootTimer = 0;
            const loads = Promise.all([loadScript(THREE_SRC), loadScript(CANNON_SRC)]);
            const timeout = new Promise((_, reject) => {
                bootTimer = setTimeout(() => reject(new Error('timeout')), 12000);
            });
            Promise.race([loads, timeout]).then(() => {
                clearTimeout(bootTimer);
                if (!window.THREE || !window.CANNON) {
                    showStatus('Vellura Towers could not start. The 3D libraries failed to load. Check your connection and reload.');
                    return;
                }
                try {
                    init();
                } catch (err) {
                    showStatus('Vellura Towers could not start. This browser could not create the 3D view.');
                }
            }).catch(() => {
                clearTimeout(bootTimer);
                showStatus('Vellura Towers could not start. The 3D libraries failed to load. Check your connection and reload.');
            });
        }());
    </script>
</body>
</html>
